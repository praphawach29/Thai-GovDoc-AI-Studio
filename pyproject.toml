[project]
name = "thai-govdoc-ai-studio"
version = "2.0.0"
description = "Thai GovDoc AI Studio — ระบบร่างและผลิตหนังสือราชการไทยอัจฉริยะ"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pythainlp>=5.0.0",
    "python-docx>=1.0.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "typst>=0.12.0",
    "google-genai>=2.0.0",
    "openai>=1.50.0",
]

[tool.vercel]
entrypoint = "core.api:app"
