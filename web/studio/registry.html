<!DOCTYPE html>
<html class="h-full bg-slate-50" lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Thai GovDoc AI Studio — ทะเบียนรับ-ส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="tw-config.js"></script>
<link href="studio.css" rel="stylesheet">
</head>
<body class="min-h-full text-slate-800 antialiased font-sans text-sm">

<header class="sticky top-0 z-20 bg-white border-b border-slate-200">
  <div class="max-w-[1400px] mx-auto px-4 h-14 flex items-center gap-3">
    <a href="./" class="w-9 h-9 shrink-0 rounded-lg hover:opacity-85 transition" title="หน้าแรก"><img src="logo.svg" alt="Thai GovDoc AI Studio" class="w-9 h-9"></a>
    <h1 class="text-base font-semibold text-slate-900 truncate"><i class="fa-solid fa-book text-brand-600 mr-1.5"></i>ทะเบียนรับ-ส่ง</h1>
    <span id="org-name" class="hidden sm:inline text-xs text-slate-500 truncate"></span>
  </div>
  <div class="max-w-[1400px] mx-auto px-4 flex gap-5 text-sm" role="tablist">
    <button type="button" role="tab" data-kind="outgoing" class="pb-2.5 border-b-2">ทะเบียนหนังสือส่ง <span id="count-outgoing" class="ml-0.5 text-[11px] px-1.5 rounded-full bg-slate-100 text-slate-600 empty:hidden"></span></button>
    <button type="button" role="tab" data-kind="incoming" class="pb-2.5 border-b-2">ทะเบียนหนังสือรับ <span id="count-incoming" class="ml-0.5 text-[11px] px-1.5 rounded-full bg-slate-100 text-slate-600 empty:hidden"></span></button>
  </div>
</header>

<main class="max-w-[1400px] mx-auto px-4 py-4 space-y-3">
  <p id="local-note" class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-xs" hidden>ทะเบียนรับ-ส่งใช้ได้เมื่อเข้าสู่ระบบ (เลขที่หนังสือออกจากฐานข้อมูลของหน่วยงาน)</p>
  <p id="error-box" class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl p-3 text-xs" hidden></p>

  <div class="flex flex-wrap items-center gap-2">
    <label class="flex items-center gap-1.5 text-xs text-slate-600">ปี พ.ศ.
      <select id="year" class="border border-slate-200 rounded-md bg-white py-1 pl-2 pr-7 text-xs focus:ring-0"></select>
    </label>
    <label id="status-wrap" class="flex items-center gap-1.5 text-xs text-slate-600">สถานะ
      <select id="status" class="border border-slate-200 rounded-md bg-white py-1 pl-2 pr-7 text-xs focus:ring-0">
        <option value="">ทั้งหมด</option><option value="issued">ออกเลขแล้ว</option><option value="reserved">จองไว้</option><option value="cancelled">ยกเลิก</option>
      </select>
    </label>
    <div class="relative flex-1 min-w-[14rem] max-w-md">
      <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[11px]"></i>
      <label for="q" class="sr-only">ค้นหาในทะเบียน</label>
      <input id="q" type="search" placeholder="ค้นเลขที่ เรื่อง ผู้รับ/ผู้ส่ง..." class="w-full text-xs pl-7 pr-3 py-1.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
    </div>
    <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer"><input id="thai" type="checkbox" checked class="rounded border-slate-300 w-3.5 h-3.5"> เลขไทย</label>
    <div class="ml-auto flex items-center gap-2">
      <button id="btn-reserve" type="button" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 font-medium text-xs"><i class="fa-solid fa-bookmark"></i>จองเลข</button>
      <button id="btn-xlsx" type="button" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs"><i class="fa-solid fa-file-excel text-emerald-700"></i>Excel</button>
      <button id="btn-pdf" type="button" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs"><i class="fa-solid fa-file-pdf"></i>PDF</button>
    </div>
  </div>

  <div class="relative bg-white border border-slate-200 rounded-xl overflow-x-auto">
    <table class="w-full text-xs">
      <thead id="thead" class="bg-slate-50 text-slate-600 text-left"></thead>
      <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
  <p class="text-[11px] text-slate-500">แบบทะเบียนตามระเบียบสำนักนายกรัฐมนตรีว่าด้วยงานสารบรรณ (ข้อ ๓๘ ทะเบียนหนังสือรับ, ข้อ ๕๐ ทะเบียนหนังสือส่ง) — ทะเบียนลบไม่ได้ เลขที่ยกเลิกยังแสดงพร้อมเหตุผล</p>
</main>

<!-- จองเลข / ยกเลิกเลข / ประวัติ -->
<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 flex flex-col max-h-[85vh] overflow-hidden animate-fadeIn">
    <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
      <h3 id="modal-title" class="text-sm font-semibold text-slate-900"></h3>
      <button type="button" data-close class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60" aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modal-body" class="flex-1 overflow-y-auto p-5 space-y-3 text-xs"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="studio.js"></script>
<script src="registry-api.js"></script>
<script src="registry.js"></script>
</body>
</html>
