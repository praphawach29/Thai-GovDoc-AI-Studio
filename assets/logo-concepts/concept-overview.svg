<text x="32" y="457" font-family="Arial" font-size="30" font-weight="700" fill="#182b36">สามช่วง สู่ฉบับสมบูรณ์</text><text x="32" y="501" font-family="Arial" font-size="17" fill="#555">สามแถวสื่อถึงเหตุ ข้อเท็จจริง และ</text><text x="32" y="529" font-family="Arial" font-size="17" fill="#555">ข้อประสงค์ พร้อมจังหวะการตรวจงาน</text><text x="32" y="557" font-family="Arial" font-size="17" fill="#555">แบบเป็นขั้นตอนและตรวจสอบได้</text><text x="32" y="628" font-family="Arial" font-size="15" fill="#777">เป็นระบบ · ตรงกับงาน · เล่าแนวคิดชัด</text></g>
<g transform="translate(998 250)"><rect width="426" height="700" rx="22" fill="#fff"/><text x="32" y="53" font-family="Arial" font-size="16" letter-spacing="2" fill="#777">C  /  TRUSTED FLOW</text>
