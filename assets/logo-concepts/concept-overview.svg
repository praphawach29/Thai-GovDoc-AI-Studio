<text x="32" y="457" font-family="Arial" font-size="30" font-weight="700" fill="#182b36">ทางเดินเอกสารอัจฉริยะ</text><text x="32" y="501" font-family="Arial" font-size="17" fill="#555">กรอบโค้งแทนขั้นตอนที่มีผู้กำกับดูแล</text><text x="32" y="529" font-family="Arial" font-size="17" fill="#555">เนื้อหาแทนหนังสือราชการ และประกาย</text><text x="32" y="557" font-family="Arial" font-size="17" fill="#555">เล็ก ๆ แทน AI ที่ช่วยอยู่เบื้องหลัง</text><text x="32" y="628" font-family="Arial" font-size="15" fill="#777">ร่วมสมัย · เป็นมิตร · มีความช่วยเหลือ</text></g>
<text x="88" y="1000" font-family="Arial" font-size="15" fill="#777">RECOMMENDATION: A — อ่านเร็วที่สุดและทำงานได้ดีในขนาดไอคอน</text>
