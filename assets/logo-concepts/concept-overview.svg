<text x="32" y="457" font-family="Arial" font-size="30" font-weight="700" fill="#182b36">เอกสารที่พร้อมส่ง</text><text x="32" y="501" font-family="Arial" font-size="17" fill="#555">หน้ากระดาษเรียบง่าย เส้นเนื้อหาแทน</text><text x="32" y="529" font-family="Arial" font-size="17" fill="#555">การร่าง และเครื่องหมายรับรองแทน</text><text x="32" y="557" font-family="Arial" font-size="17" fill="#555">ขั้นตรวจทานของเจ้าหน้าที่</text><text x="32" y="628" font-family="Arial" font-size="15" fill="#777">ชัดเจน · เป็นทางการ · ใช้เป็นไอคอนได้ดี</text></g>
