<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <!-- Thai Royal Garuda (พระครุฑพ่าห์) Emblem Silhouette / Vector -->
  <g fill="#B22222" stroke="#8B0000" stroke-width="1.5" stroke-linejoin="round">
    <!-- Crown / Chada -->
    <path d="M200,10 L205,35 L215,60 L208,65 L218,85 L200,90 L182,85 L192,65 L185,60 L195,35 Z" fill="#DAA520" stroke="#B8860B"/>
    <circle cx="200" cy="8" r="4" fill="#DAA520" />
    <path d="M190,90 Q200,82 210,90 Q205,100 195,100 Z" fill="#DAA520"/>

    <!-- Head & Face -->
    <path d="M190,95 Q200,90 210,95 Q218,105 215,120 Q200,135 185,120 Q182,105 190,95 Z" />
    <!-- Beak -->
    <path d="M195,110 Q200,108 205,110 Q208,125 200,132 Q192,125 195,110 Z" fill="#FF8C00"/>
    <!-- Eyes -->
    <circle cx="193" cy="108" r="2.5" fill="#FFFFFF"/>
    <circle cx="193" cy="108" r="1.2" fill="#000000"/>
    <circle cx="207" cy="108" r="2.5" fill="#FFFFFF"/>
    <circle cx="207" cy="108" r="1.2" fill="#000000"/>

