    <!-- Right Wing (Symmetrical Spread Outwards and Upwards) -->
    <path d="M225,135 C250,110 290,90 330,85 C335,95 320,115 295,125 C320,120 350,115 365,125 C355,135 325,145 300,150 C325,150 355,150 370,165 C355,172 325,170 295,170 C320,175 345,185 355,200 C340,205 310,195 285,190 C305,200 330,215 335,230 C320,232 290,215 270,205 C285,220 305,245 305,260 C290,258 265,235 250,220 C260,240 275,270 270,285 C255,280 240,250 230,230 Q225,180 225,135 Z" fill="#B22222"/>

    <!-- Left Arm (Raised Upward and Bent) -->
    <path d="M175,140 Q150,150 140,170 Q130,190 145,195 Q155,192 165,178 Q172,165 178,155 Z" />
    <path d="M138,185 Q130,195 125,190 Q125,180 138,175 Z" fill="#DAA520"/>

    <!-- Right Arm (Raised Upward and Bent) -->
    <path d="M225,140 Q250,150 260,170 Q270,190 255,195 Q245,192 235,178 Q228,165 222,155 Z" />
    <path d="M262,185 Q270,195 275,190 Q275,180 262,175 Z" fill="#DAA520"/>

    <!-- Waist & Belt (Kanchana / Sangwan) -->
    <path d="M175,185 Q200,195 225,185 L228,205 Q200,215 172,205 Z" fill="#DAA520"/>
    <path d="M190,205 L200,235 L210,205 Z" fill="#DAA520"/>

    <!-- Thighs & Lower Body (Anthropomorphic Legs) -->
    <path d="M175,205 Q160,220 155,250 Q170,265 185,250 Q188,230 185,205 Z" />
    <path d="M225,205 Q240,220 245,250 Q230,265 215,250 Q212,230 215,205 Z" />

