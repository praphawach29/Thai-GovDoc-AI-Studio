    <path d="M155,250 Q145,275 140,295 Q150,300 160,290 Q165,275 170,255 Z" fill="#FF8C00"/>
    <path d="M135,295 L125,310 L138,308 Z" fill="#B8860B"/>
    <path d="M145,298 L142,315 L152,310 Z" fill="#B8860B"/>
    <path d="M158,295 L162,312 L168,305 Z" fill="#B8860B"/>

    <path d="M245,250 Q255,275 260,295 Q250,300 240,290 Q235,275 230,255 Z" fill="#FF8C00"/>
    <path d="M265,295 L275,310 L262,308 Z" fill="#B8860B"/>
    <path d="M255,298 L258,315 L248,310 Z" fill="#B8860B"/>
    <path d="M242,295 L238,312 L232,305 Z" fill="#B8860B"/>

