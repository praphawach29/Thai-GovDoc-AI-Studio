    <path d="M180,130 Q200,145 220,130 Q215,148 200,152 Q185,148 180,130 Z" fill="#DAA520"/>
    <circle cx="200" cy="155" r="5" fill="#DAA520"/>

    <!-- Left Wing (Spread Outwards and Upwards) -->
